<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <!-- Zustände eines Raft-Knotens; Quelltext: raft_zustaende.puml -->
  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="#ffffff"/>

  <!-- Start -->
  <circle cx="40" cy="215" r="9" fill="#333"/>
  <line x1="49" y1="215" x2="98" y2="215" stroke="#333" stroke-width="1.5" marker-end="url(#pfeil)"/>
  <text x="30" y="245" font-size="11" fill="#444">Start</text>

  <!-- Follower -->
  <rect x="100" y="165" width="160" height="100" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="180" y="190" text-anchor="middle" font-weight="bold" font-size="15">Follower</text>
  <text x="180" y="212" text-anchor="middle" font-size="11">stimmt einmal pro Term,</text>
  <text x="180" y="227" text-anchor="middle" font-size="11">nur bei aktuellem Log;</text>
  <text x="180" y="242" text-anchor="middle" font-size="11">Timer zurück bei Heartbeat</text>
  <text x="180" y="257" text-anchor="middle" font-size="11">und abgegebener Stimme</text>

  <!-- Candidate -->
  <rect x="300" y="20" width="160" height="90" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="380" y="45" text-anchor="middle" font-weight="bold" font-size="15">Candidate</text>
  <text x="380" y="67" text-anchor="middle" font-size="11">Term + 1, Stimme für sich,</text>
  <text x="380" y="82" text-anchor="middle" font-size="11">RequestVote parallel</text>
  <text x="380" y="97" text-anchor="middle" font-size="11">an alle anderen</text>

  <!-- Leader -->
  <rect x="560" y="165" width="170" height="100" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="645" y="190" text-anchor="middle" font-weight="bold" font-size="15">Leader</text>
  <text x="645" y="212" text-anchor="middle" font-size="11">No-Op im neuen Term,</text>
  <text x="645" y="227" text-anchor="middle" font-size="11">Heartbeats alle 0,3 s,</text>
  <text x="645" y="242" text-anchor="middle" font-size="11">prüft das Quorum</text>
  <text x="645" y="257" text-anchor="middle" font-size="11">alle 20 ms</text>

  <!-- Follower -> Candidate -->
  <path d="M150,165 C150,90 220,65 298,62" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#pfeil)"/>
  <text x="70" y="88" font-size="11">Election-Timeout</text>
  <text x="70" y="102" font-size="11">(zufällig 1,5–3 s)</text>
  <text x="70" y="116" font-size="11">ohne AppendEntries</text>

  <!-- Candidate -> Follower -->
  <path d="M330,110 C320,150 290,180 262,195" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#pfeil)"/>
  <text x="300" y="160" font-size="11">Leader meldet sich</text>
  <text x="300" y="174" font-size="11">oder höherer Term</text>

  <!-- Candidate -> Candidate -->
  <path d="M460,45 C520,10 520,90 462,80" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#pfeil)"/>
  <text x="525" y="45" font-size="11">keine Mehrheit</text>
  <text x="525" y="59" font-size="11">(Split Vote):</text>
  <text x="525" y="73" font-size="11">neue Wahl, Term + 1</text>

  <!-- Candidate -> Leader -->
  <path d="M440,110 C480,150 530,170 558,190" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#pfeil)"/>
  <text x="470" y="125" font-size="11">Stimmen einer Mehrheit</text>
  <text x="470" y="139" font-size="11">(n // 2 + 1)</text>

  <!-- Leader -> Follower -->
  <path d="M560,240 C470,330 350,330 262,250" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#pfeil)"/>
  <text x="300" y="345" font-size="11">höherer Term in einer Antwort, oder Check-Quorum:</text>
  <text x="300" y="359" font-size="11">länger als 3 s keine Antwort von einer Mehrheit</text>

  <text x="380" y="415" text-anchor="middle" font-size="11" fill="#666">Term und Stimme werden vor jeder Antwort gespeichert (--data-dir)</text>
</svg>
